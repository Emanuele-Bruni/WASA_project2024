# Independent project, ephemeral database, no host ports or production volumes.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      CFG_DB_FILENAME: /data/test.db
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
    healthcheck:
      test: [CMD, /app/healthcheck]
      interval: 2s
      timeout: 3s
      retries: 30
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1770
  browser:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    working_dir: /work/webui
    init: true
    ipc: host
    volumes:
      - .:/work
      - browser_node_modules:/work/webui/node_modules
    environment:
      CI: 'true'
      E2E_BASE_URL: http://frontend:8080
      E2E_API_URL: http://backend:3000
      VITE_PROXY_TARGET: http://backend:3000
      YARN_GLOBAL_FOLDER: /tmp/yarn-global
    command: sh -c 'node .yarn/releases/yarn-4.5.0.cjs install --immutable --immutable-cache && node .yarn/releases/yarn-4.5.0.cjs test:browser'
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
volumes:
  browser_node_modules:
