openapi: 3.0.3
info:
  title: WasaText API V2
  version: 2.0.0-dev
  description: 'Contratto API della fase 6. Risposte singole racchiuse per risorsa, collezioni come array (mai
    null), errori JSON comuni. Le sessioni sono in memoria e terminano al riavvio. Tutte le rotte inesistenti
    restituiscono Error 404; i metodi non consentiti restituiscono Error 405 con Allow. Il limite del corpo
    JSON è 2 MiB (413); un media type diverso da application/json produce 415. Un errore interno non espone
    dettagli SQL. La fase 7 aggiunge paginazione, cursori incrementali, anteprime e immagini binarie protette:
    vedere doc/messages-and-images.md.'
servers:
- url: http://localhost:3000
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
      description: Token casuale restituito dal login, valido 24 ore e revocabile tramite logout. Il nome utente
        conserva il modello di accesso del progetto; gli ID non sono credenziali.
  schemas:
    ID:
      type: integer
      format: int64
      minimum: 1
    User:
      type: object
      additionalProperties: false
      required:
      - userId
      - name
      - photo
      properties:
        userId:
          $ref: '#/components/schemas/ID'
        name: &id001
          type: string
          minLength: 3
          maxLength: 16
          description: 3–16 Unicode code points after trimming outer spaces; control characters are rejected.
            Case-sensitive.
        photo:
          type: string
          pattern: ^(/media/[1-9]\d*)?$
          description: Authenticated binary media URL, or empty when absent. No base64 in resource responses.
    Conversation:
      type: object
      additionalProperties: false
      required:
      - conversationId
      - title
      - photo
      - isGroup
      - members
      - lastMessage
      properties:
        conversationId:
          $ref: '#/components/schemas/ID'
        title:
          type: string
        photo:
          type: string
          pattern: ^(/media/[1-9]\d*)?$
          description: Authenticated binary media URL, or empty when absent. No base64 in resource responses.
        isGroup:
          type: boolean
        members:
          type: array
          items:
            $ref: '#/components/schemas/User'
        lastMessage:
          $ref: '#/components/schemas/MessagePreview'
    Comment:
      type: object
      additionalProperties: false
      required:
      - commentId
      - authorId
      - emoji
      properties:
        commentId:
          $ref: '#/components/schemas/ID'
        authorId:
          $ref: '#/components/schemas/ID'
        emoji:
          $ref: '#/components/schemas/Emoji'
    Message:
      type: object
      additionalProperties: false
      required:
      - messageId
      - authorId
      - author
      - text
      - hours
      - createdAt
      - forwarded
      - originalMessageId
      - comments
      - type
      - image
      properties:
        messageId: &id003
          $ref: '#/components/schemas/ID'
        authorId: &id004
          $ref: '#/components/schemas/ID'
        author: *id001
        text:
          type: string
          minLength: 0
          maxLength: 2000000
          x-maxUtf8Bytes: 2000000
        hours: &id007
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        createdAt: &id006
          type: string
          format: date-time
        forwarded: &id008
          type: boolean
        originalMessageId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        type: &id005
          type: string
          enum:
          - text
          - image
        image:
          $ref: '#/components/schemas/Image'
    Emoji:
      type: string
      minLength: 1
      maxLength: 16
      description: 'One Unicode symbol sequence: symbols (So), optional variation selectors/skin modifiers
        and ZWJ joins; regional-indicator flag pairs and keycaps are supported. Plain text is rejected.'
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - invalid_request
              - unauthorized
              - forbidden
              - not_found
              - method_not_allowed
              - conflict
              - payload_too_large
              - unsupported_media_type
              - internal_error
            message:
              type: string
              minLength: 1
            field:
              type: string
              minLength: 1
    Session:
      type: object
      additionalProperties: false
      required:
      - user
      - token
      - expiresAt
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
        expiresAt:
          type: string
          format: date-time
    UserResponse:
      type: object
      additionalProperties: false
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    UsersResponse:
      type: object
      additionalProperties: false
      required:
      - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    ConversationResponse:
      type: object
      additionalProperties: false
      required:
      - conversation
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
    ConversationsResponse:
      type: object
      additionalProperties: false
      required:
      - conversations
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
    MessageResponse:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          $ref: '#/components/schemas/Message'
    MessagesResponse:
      type: object
      additionalProperties: false
      required:
      - messages
      - deletedIds
      - cursor
      - before
      - hasMore
      - hasMoreChanges
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        deletedIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
        cursor:
          type: string
          pattern: ^\d+$
        before:
          type: string
          nullable: true
          maxLength: 256
        hasMore:
          type: boolean
        hasMoreChanges:
          type: boolean
    CommentResponse:
      type: object
      additionalProperties: false
      required:
      - comment
      properties:
        comment:
          $ref: '#/components/schemas/Comment'
    NameRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name: *id001
    TitleRequest:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title: &id002
          type: string
          minLength: 1
          maxLength: 25
          description: 1–25 Unicode code points after trimming outer spaces; control characters are rejected.
    MemberRequest:
      type: object
      additionalProperties: false
      required:
      - userId
      properties:
        userId:
          $ref: '#/components/schemas/ID'
    GroupRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - userIds
      properties:
        title: *id002
        userIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          minItems: 2
          maxItems: 16
          uniqueItems: true
          description: Other participants; the current user is added automatically and must not appear here.
    MessageRequest:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - text
          - image
        text:
          type: string
          maxLength: 2000000
          x-maxUtf8Bytes: 2000000
        image:
          $ref: '#/components/schemas/ImageUpload'
      description: type=text requires nonblank text and no image. type=image requires image with absent/empty
        text. The old [foto] prefix is ordinary text.
      oneOf:
      - properties:
          type:
            enum:
            - text
          text:
            minLength: 1
        required:
        - text
        not:
          required:
          - image
      - properties:
          type:
            enum:
            - image
          text:
            maxLength: 0
        required:
        - image
    ReactionRequest:
      type: object
      additionalProperties: false
      required:
      - emoji
      properties:
        emoji:
          $ref: '#/components/schemas/Emoji'
    PhotoRequest:
      type: object
      additionalProperties: false
      required:
      - image
      properties:
        image:
          $ref: '#/components/schemas/ImageUpload'
    EmptyRequest:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    Image:
      type: object
      additionalProperties: false
      required:
      - imageId
      - url
      - mimeType
      - name
      - width
      - height
      - size
      properties:
        imageId:
          $ref: '#/components/schemas/ID'
        url:
          type: string
          pattern: ^/media/[1-9]\d*$
        mimeType:
          type: string
          enum:
          - image/png
          - image/jpeg
        name:
          type: string
          minLength: 1
          maxLength: 128
        width:
          type: integer
          minimum: 1
          maximum: 4096
        height:
          type: integer
          minimum: 1
          maximum: 4096
        size:
          type: integer
          minimum: 1
          maximum: 1500000
      nullable: true
    ImageUpload:
      type: object
      additionalProperties: false
      required:
      - mimeType
      - data
      properties:
        mimeType:
          type: string
          enum:
          - image/png
          - image/jpeg
        data:
          type: string
          format: byte
          minLength: 1
          maxLength: 2000000
          description: Strict base64; at most 1500000 decoded bytes. MIME and full image decoding must match.
            Maximum 4096 pixels per side and 4194304 total pixels.
        name:
          type: string
          maxLength: 128
    MessagePreview:
      type: object
      additionalProperties: false
      required:
      - messageId
      - authorId
      - author
      - type
      - text
      - createdAt
      - hours
      - forwarded
      properties:
        messageId: *id003
        authorId: *id004
        author: *id001
        type: *id005
        text:
          type: string
          minLength: 0
          maxLength: 200
          x-maxUtf8Bytes: 2000000
        createdAt: *id006
        hours: *id007
        forwarded: *id008
      nullable: true
  responses:
    BadRequest:
      description: Dati non validi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_request
              message: Dati non validi
    Unauthorized:
      description: Sessione assente, scaduta o non valida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Sessione assente, scaduta o non valida
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge
          schema:
            type: string
            enum:
            - Bearer
    Forbidden:
      description: Permessi insufficienti
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Permessi insufficienti
    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Risorsa non trovata
    MethodNotAllowed:
      description: Metodo non consentito
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: method_not_allowed
              message: Metodo non consentito
      headers:
        Allow:
          description: Allowed methods for the matching route
          schema:
            type: string
    Conflict:
      description: La risorsa esiste già o il valore è già utilizzato
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: conflict
              message: La risorsa esiste già o il valore è già utilizzato
    PayloadTooLarge:
      description: Il corpo della richiesta supera 2 MiB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: payload_too_large
              message: Il corpo della richiesta supera 2 MiB
    UnsupportedMediaType:
      description: 'Usa Content-Type: application/json con codifica UTF-8'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unsupported_media_type
              message: 'Usa Content-Type: application/json con codifica UTF-8'
    InternalError:
      description: Errore interno del server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: Errore interno del server
paths:
  /login:
    post:
      operationId: doLogin
      summary: Accedi tramite nome e crea una sessione valida per 24 ore
      responses:
        '200':
          description: Operazione completata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                user: &id009
                  userId: 1
                  name: alice
                  photo: ''
                token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                expiresAt: '2026-11-09T12:34:56Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        description: 'Exactly one UTF-8 JSON object; unknown, repeated or null fields are rejected. Maximum
          body size: 2097152 bytes.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRequest'
            example:
              name: alice
  /logout:
    post:
      operationId: logout
      summary: Revoca la sessione corrente
      responses:
        '204':
          description: Operazione completata senza contenuto
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: false
        description: 'Exactly one UTF-8 JSON object; unknown, repeated or null fields are rejected. Maximum
          body size: 2097152 bytes.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
  /users:
    get:
      operationId: getUsers
      summary: Elenca gli altri utenti ordinati per ID
      responses:
        '200':
          description: Operazione completata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
              example:
                users: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userid}:
    parameters:
    - name: userid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    post:
      operationId: newConversation
      summary: Crea una chat privata; 409 se esiste già e 400 per una chat con se stessi
      responses:
        '201':
          description: Risorsa creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
              example: &id010
                conversation:
                  conversationId: 1
                  title: bobby
                  photo: ''
                  isGroup: false
                  members:
                  - *id009
                  - userId: 2
                    name: bobby
                    photo: ''
                  lastMessage: null
          headers:
            Location:
              description: Relative URI of the newly created resource
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: false
        description: 'Exactly one UTF-8 JSON object; unknown, repeated or null fields are rejected. Maximum
          body size: 2097152 bytes.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
  /conversations:
    get:
      operationId: getMyConversations
      summary: Conversation list with lastMessage preview (or null), sorted by newest message timestamp/ID,
        then descending conversation ID for empty chats. No per-conversation history request is needed.
      responses:
        '200':
          description: Operazione completata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsResponse'
              example:
                conversations: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: newGroup
      summary: Crea un gruppo con altri 2–16 utenti distinti
      responses:
        '201':
          description: Risorsa creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
              example: *id010
          headers:
            Location:
              description: Relative URI of the newly created resource
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        description: 'Exactly one UTF-8 JSON object; unknown, repeated or null fields are rejected. Maximum
          body size: 2097152 bytes.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
            example:
              title: Team
              userIds:
              - 2
              - 3
  /conversations/{conversationid}:
    parameters:
    - name: conversationid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    get:
      operationId: getConversation
      summary: Leggi una conversazione di cui sei membro
      responses:
        '200':
          description: Operazione completata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
              example: *id010
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /conversations/{conversationid}/messages:
    parameters:
    - name: conversationid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    get:
      operationId: getMessages
      summary: Latest 50 messages by default, older pages with before, incremental changes with since. Returned
        messages are ascending by timestamp and ID.
      responses:
        '200':
          description: Operazione completata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesResponse'
              example:
                messages: []
                deletedIds: []
                cursor: '0'
                before: null
                hasMore: false
                hasMoreChanges: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: before
        schema:
          type: string
          maxLength: 256
        description: Opaque cursor from the previous page; exclusive and bound to this conversation. Mutually
          exclusive with since.
      - in: query
        name: since
        schema:
          type: string
          pattern: ^\d+$
        description: Change cursor from the initial page or previous delta. Covers message creation, updates,
          reactions, author renames and deletions. Drain hasMoreChanges using the returned cursor.
    post:
      operationId: sendMessage
      summary: Invia un messaggio
      responses:
        '201':
          description: Risorsa creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example: &id011
                message:
                  messageId: 1
                  authorId: 1
                  author: alice
                  text: Ciao!
                  hours: '12:34'
                  createdAt: '2026-11-08T12:34:56.123456789Z'
                  forwarded: false
                  originalMessageId: null
                  comments: []
                  type: text
                  image: null
          headers:
            Location:
              description: Relative URI of the newly created resource
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        description: 'Exactly one UTF-8 JSON object; unknown, repeated or null fields are rejected. Maximum
          body size: 2097152 bytes.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
            example:
              type: text
              text: Ciao!
  /conversations/{conversationid}/messages/{messageid}:
    parameters:
    - name: conversationid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    - name: messageid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    delete:
      operationId: deleteMessage
      summary: Elimina un proprio messaggio e le relative reazioni
      responses:
        '204':
          description: Operazione completata senza contenuto
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: false
        description: 'Exactly one UTF-8 JSON object; unknown, repeated or null fields are rejected. Maximum
          body size: 2097152 bytes.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
  /conversations/{conversationid}/messages/{messageid}/forward/{forwardid}:
    parameters:
    - name: conversationid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    - name: messageid
      in: path
