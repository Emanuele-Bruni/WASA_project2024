openapi: 3.0.3
info:
  title: WasaText
  description: |
      Connect with your friends effortlessly using WASAText! <br>
      Send and receive messages, whether one-on-one or in groups, all from the convenience of your PC. <br>
      Enjoy seamless conversations with text or GIFs and easily stay in touch through your private chats or group discussions.
  version: "1"
  
components:
  #SCHEMAS
  schemas:
    User:
      type: object
      description: user's details
      properties:
        userId:
          type: integer
          description: user's number Id
          example: 000000
        name:
          type: string
          description: user's name
          example: "Gennaro"
          minLength: 1
          maxLength: 16
          pattern: "^.*?$"
        photo:
          $ref: "#/components/schemas/Photo"
        bio:
            type: string
            description: what user writes about him
            example: "based in Rome"
            minLength: 1
            maxLength: 25
            pattern: "^.*?$"
        number:
            type: string
            pattern: '^\+[0-9]+$'
            minLength: 10
            maxLength: 15
            description: user's cellphone number
            example: '+3972837482'
     
    Conversation:
      type: object
      description: conversation between different users
      properties:
        conversationId: 
          type: integer
          description: conversation's code
          minimum: 10000
          example: 12345
        title:
          type: string
          description: conversation name
          example: "Gruppo calcetto"
        photo:
          $ref: "#/components/schemas/Photo"
        isGroup:
          type: boolean
          description: It's true if the conversation is a group, else it's false
    
    Message:
      type: object
      description: character string
      properties:
        messageId:
          type: integer
          description: message identifier
          minimum: 10000
          example: 12345
        author:
          type: string
          description: who wrote the message
          example: "Franco Bollo"
          minLength: 1
          maxLength: 16
          pattern: "^.*?$"
        text:
          type: string
          description: content of the message
          example: "Buongiorno!"
          minLength: 1
          maxLength: 999
          pattern: "^.*?$"
        hours:
          type: string
          description: at what time the message was sent
          example: "12:33"
          minLength: 1
          maxLength: 5
          pattern: '^\d{2}:\d{2}$'
        comments: 
          type: array
          description: other user messages under a message
          minItems: 0
          maxItems: 50
          items:
            $ref: "#/components/schemas/Comment"
           
    Comment:
      type: object
      description: character string under a Message
      properties:
        commentId:
          type: integer
          description: comment identifier
          minimum: 10000
        author:
          type: string
          description: who wrote the comment 
          minLength: 1
          maxLength: 16
          pattern: "^.*?$"
        emoji:
          type: string
          description: the effective comment
          minLength: 1
          maxLength: 2
          pattern: "^[\u0000-\uFFFF]+$"
    
    Group:
      type: object
      description: list of users
      properties:
        groupId:
          type: integer
          description: message identifier
          minimum: 10000
          example: 12345
        groupPhoto:
          $ref: "#/components/schemas/Photo"
        groupName:
          type: string
          example: "Informatics"
          description: title of the group
          minLength: 1
          maxLength: 16
          pattern: "^.*?$"
        members:
          type: array
          minItems: 2
          maxItems: 100
          description: all the users in the group
          items:
            $ref: "#/components/schemas/User"
    
    Photo:
      type: object
      description: photo chosen by the user
      properties:
        photoId:
          type: integer
          minimum: 00000
          maximum: 99999
          example: 12345
          description: photo identifier
        photoContent:
          type: string
          format: binary
          description: photo's content 
          example: "abCacDFDGhj..."
          minLength: 0
          maxLength: 1398101
        size:
          type: object
          description: width x height
          properties: 
            width: 
              type: integer
              description: photo's width
            height:
              type: integer
              description: photo's height
  
  #PARAMETERS               
  parameters:
    conversationId:
      schema:
        type: integer
        minimum: 0
        maximum: 99999
      required: true
      description: conversation identifier
      in: path
      name: conversationid
    
    messageId:
      schema:
        type: integer
        minimum: 0
        maximum: 99999
      description: message identifier
      required: true
      in: path
      name: messageid
      
    commentId:
      schema:
        type: integer
        minimum: 0
        maximum: 99999
      description: comment identifier
      required: true
      in: path
      name: commentid
    
    groupId:
      schema:
        type: integer
        minimum: 0
        maximum: 99999
      description: group identifier
      required: true
      in: path
      name: groupid

    forwardId:
      schema:
        type: integer
        minimum: 0
        maximum: 99999
      description: identifies which user to send the message to
      required: true
      in: path
      name: forwardid

  #SECURITY
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

#TAGS
tags:
  - name: Login
    description: User login operations
  - name: Profile
    description: User profile operations
  - name: Conversations
    description: Conversations operations
  - name: Messages
    description: Messaging operations
  - name: Comments
    description: Operations relating to message comments
  - name: Groups
    description: Operations relating to groups
      
security:
  - bearerAuth: [] 

paths:
  #doLogin
  /login:
    post:
      security: []
      tags: ["Login"]
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created, and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User Details
        content:
          application/json:
            schema:
              description: User properties
              type: object
              properties:
                name:
                  type: string
                  description: user name
                  example: Maria
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
        required: True
      responses:
        "200":
          description: User log-in action successful
          content:
            application/json:
              schema:
                description: what return after login
                type: object
                properties:
                  identifier:
                    type: string
                    description: password
                    example: "abcdef012345"
              example: {identifier: "abcd2394"}
                    
  #setMyUserName
  /settings/username:
    patch:
      tags: ["Profile"]
      summary: Set your username
      description: |
        You can set a new username
      operationId: setMyUserName
      requestBody:
        description: insert here the username
        required: true
        content:
          application/json:
           schema:
              description: username's schema
              type: object
              properties:
                username:
                  $ref: "#/components/schemas/User/properties/name"
      responses:
        "204":
          description: username set
      
  #getMyConversations
  /conversations:
    get:
      tags: ["Conversations"]
      summary: get all user's conversations
      description: |
        You can see user's conversations history here
      operationId: getMyConversations
      responses:
        "404":
          description: user's conversations not found
        "200":
          description: user's conversations found
          content:
            application/json:
              schema:
                description: conversation properties
                type: object
                properties:
                  conversations:
                    description: user conversations
                    type: array
                    minItems: 0
                    maxItems: 9999
                    items:
                      $ref: "#/components/schemas/Conversation"
              example:
                conversationId: 12345
                title: "Avanti Lazio"
                photo: "https://example.com/images/foto-paesaggio.jpg"
                isGroup: True
                      
  #getConversation 
  /conversations/{conversationid}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      tags: ["Conversations"]
      summary: get a specific conversation
      description: |
        You can see a specific conversation
      operationId: getConversation
      responses:
        "404":
          description: conversation not found
        "200":
          description: conversation found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
              example:
                conversationId: 12345
                title: "Avanti Lazio"
                photo: 
                  photoId: 02819
                  photoContent: "abCacDFDGhj..."
                  size: 
                    width: 20
                    height: 20
                isGroup: false
          
  #sendMessage 
  /conversations/{conversationid}/message:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    post:
      tags: ["Messages"]
      summary: send a new message
      description: |
        You can send a new message in a specific conversation
      operationId: sendMessage
      requestBody:
        required: true
        description: Message that you want to send
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
        "200":
          description: sending successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                messageId: 10052
                author: "MarcoL"
                text: "Ciao, posso parlarti?"
                hours: "22:20"
                comments: [{commentId: 12345 ,author: "Stef" ,text: "No" ,feedback: {like: 2, dislike: 3}},
                            {commentId: 54321 ,author: "Gio" ,text: "ahahah" ,feedback: {like: 4, dislike: 0}}]

        "400":
          description: unable to send the message
  
  #forwardMessage
  /conversations/{conversationid}/messages/{messageid}/forward/{forwardid}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
      - $ref: "#/components/parameters/messageId"
      - $ref: "#/components/parameters/forwardId"
    post:
      tags: ["Messages"]
      summary: forward a message
      description: |
        You can forward a message
      operationId: forwardMessage
      responses:
        "400":
          description: unable to forward the message
        "200":
          description: forwarded message
          content:
            application/json:
              schema:
                $ref : "#/components/schemas/Message"
              example:
                messageId: 10052
                author: "MarcoL"
                text: "Ciao, posso parlarti?"
                hours: "22:20"
                comments: [{commentId: 12345 ,author: "Stef" ,text: "No" ,feedback: {like: 2, dislike: 3}},
                            {commentId: 54321 ,author: "Gio" ,text: "ahahah" ,feedback: {like: 4, dislike: 0}}]
  
  #commentMessage
  /conversations/{conversationid}/messages/{messageid}/comments:
    parameters:
      - $ref: "#/components/parameters/messageId"
      - $ref: "#/components/parameters/conversationId"
    post:
      tags: ["Comments"]
      summary: comment a message
      description: |
        You can add a comment under a message
      operationId: commentMessage
      requestBody:
        required: true
        description: Comment that you want to add below a message
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Comment"
      responses:
        "400":
          description: unable to comment the message
        "201":
          description: message commented correctly
          content:
            application/json:
              schema:
                $ref : "#/components/schemas/Comment"
              example:
                commentId: 10001
                author: "stefano123"
                text: "Secondo me, si"
                feedback: {like: 12, dislike: 0}
  
  #uncommentMessage
  /conversations/{conversationid}/messages/{messageid}/comments/{commentid}:
    parameters:
      - $ref: "#/components/parameters/messageId"
      - $ref: "#/components/parameters/commentId"
      - $ref: "#/components/parameters/conversationId"
    delete:
      tags: ["Comments"]
      summary: uncomment a message
      description: |
        You can delete a specific comment under a message 
      operationId: uncommentMessage
      responses:
        "400":
          description: unable to delete the comment
        "204":
          description: comment deleted
          
  #deleteMessage
  /conversations/{conversationid}/messages/{messageid}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
      - $ref: "#/components/parameters/messageId"
    delete:
      tags: ["Messages"]
      summary: delete a message
      description: |
        You can delete a specific message in a specific conversation
      operationId: deleteMessage
      responses:
        "400":
          description: unable to delete the message
        "204":
          description: message deleted
  
  #addToGroup
  /conversations/groups/{groupid}/members:
    parameters:
      - $ref: "#/components/parameters/groupId"
    patch:
      tags: ["Groups"]
      summary: add to a group
      description: |
        You can add a member to a group
      operationId: addToGroup
      requestBody:
        required: true
        description: User that you want to add to group
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "400":
          description: unable to add 
        "200":
          description: added member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
              example:
                  groupId: 10025
                  groupName: "Informatics" 
                  members:
                    - userId: 0
                      name: "Luca"
                      photo: 
                        photoId: 02819
                        photoContent: "abCacDFDGhj..."
                        size: 
                          width: 20
                          height: 20
                      bio: "i'm working"
                      number: "+3933333333"
                    - userId: 1
                      name: "Mia"
                      photo: 
                        photoId: 02819
                        photoContent: "abCacDFDGhj..."
                        size: 
                          width: 20
                          height: 20
                      bio: "i love dogs"
                      number: "+3933333344"

  #leaveGroup 
  /conversations/groups/{groupid}:
    parameters:
      - $ref: "#/components/parameters/groupId"
    delete:
      tags: ["Groups"]
      summary: leave a group
      description: |
        You can leave a group you no longer want to be a part of
      operationId: leaveGroup
      responses:  
        "204":
            description: you left the group
        "400":
            description: unable to leave group

  #setGroupName 
  /conversations/groups/{groupid}/name:
    parameters:
      - $ref: "#/components/parameters/groupId"
    patch:
      tags: ["Groups"]
      summary: set a new group name
      description: |
        You can set or change a group name
      operationId: setGroupName
      requestBody:
        required: true
        description: Name that you want to give to a group
        content:
          application/json:
            schema:
              description: future group name
              type: object
              properties:
                groupName:
                  $ref: "#/components/schemas/Group/properties/groupName"
      responses:
        "200":
            description: group name set
            content:
              application/json: 
                schema: 
                  description: group name
                  type: string
                example: "Informatics"
        "400":
          description: unable to set a new group name

  #setMyPhoto 
  /settings/photo:
    patch:
      tags: ["Profile"]
      summary: Set your profile photo
      description: |
        You can set or change your profile photo
      operationId: setMyPhoto
      requestBody:
        required: true
        description: Photo that you want to set
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Photo"
      responses:
        "400":
          description: unable to set a new photo
        "200":
          description: new profile photo set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
              example:
                photoId: 12345
                photoContent: "abCacDFDGhj..."
                size: {width: 12, heigth: 10}

  #setGroupPhoto 
  /conversations/groups/{groupid}/photo:
    parameters:
      - $ref: "#/components/parameters/groupId"
    patch:  
      tags: [Groups]
      summary: Set a new group photo
      description: |
        You can set or change a group photo
      operationId: setGroupPhoto
      requestBody:
        required: true
        description: Photo that you want to set
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Photo"
      responses:
        "200":
            description: group photo set
            content:
              application/json:
                schema: 
                  $ref: "#/components/schemas/Group"
                example:
                  groupId: 10025
                  groupName: "Informatics" 
                  members:
                    - userId: 0
                      name: "Luca"
                      photo: 
                        photoId: 02819
                        photoContent: "abCacDFDGhj..."
                        size: 
                          width: 20
                          height: 20 
                      bio: "i'm working"
                      number: "+3933333333"
                    - userId: 1
                      name: "Mia"
                      photo: 
                        photoId: 02819
                        photoContent: "abCacDFDGhj..."
                        size: 
                          width: 20
                          height: 20
                      bio: "i love dogs"
                      number: "+3933333344"
        "400":
            description: unable to set a new photo
    