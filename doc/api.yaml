openapi: 3.0.3
info:
  title: WasaText
  description: |
      Connect with your friends effortlessly using WASAText! <br>
      Send and receive messages, whether one-on-one or in groups, all from the convenience of your PC. <br>
      Enjoy seamless conversations with text or GIFs and easily stay in touch through your private chats or group discussions.
  version: "1"
  
components:
  #SCHEMAS
  schemas:
    User:
      type: object
      description: user's details
      properties:
        userId:
          type: integer
          description: user's number Id
          example: 34
        name:
          type: string
          description: user's name
          example: "Gennaro"
          minLength: 3
          maxLength: 16
          pattern: "^.*?$"
        photo:
          type: string
          description: photo
          format: binary
          example: "abcDFHDIaaaz..."
          minLength: 0
          maxLength: 1000000
        bio:
            type: string
            description: what user writes about him
            example: "based in Rome"
            minLength: 1
            maxLength: 25
            pattern: "^.*?$"
        number:
            type: string
            pattern: '^\+[0-9]+$'
            minLength: 10
            maxLength: 15
            description: user's cellphone number
            example: '+3972837482'

    Conversation:
      type: object
      description: conversation between different users
      properties:
        conversationId: 
          type: integer
          description: conversation's code
          minimum: 1
          example: 124
        title:
          type: string
          description: conversation name
          example: "Gruppo calcetto"
          minLength: 1
          maxLength: 16
          pattern: "^.*?$"
        photo:
          type: string
          description: photo
          format: binary
          example: "abcDFHDIaaaz..."
          minLength: 0
          maxLength: 1000000
        members:
          type: array
          minItems: 2
          maxItems: 30
          description: all the users in the group
          items:
            $ref: "#/components/schemas/User"
        isGroup:
          type: boolean
          description: It's true if the conversation is a group, else it's false
    
    Message:
      type: object
      description: character string
      properties:
        messageId:
          type: integer
          description: message identifier
          minimum: 1
          example: 124
        author:
          type: string
          description: who wrote the message
          example: "Franco Bollo"
          minLength: 1
          maxLength: 16
          pattern: "^.*?$"
        text:
          type: string
          description: content of the message
          example: "Buongiorno!"
          minLength: 1
          maxLength: 30
          pattern: "^.*?$"
        hours:
          type: string
          description: at what time the message was sent
          example: "00:00"
          minLength: 5
          maxLength: 5
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
        comments: 
          type: array
          description: other user messages under a message
          minItems: 0
          maxItems: 20
          items:
            $ref: "#/components/schemas/Comment"
           
    Comment:
      type: object
      description: character string under a Message
      properties:
        commentId:
          type: integer
          description: comment identifier
          minimum: 1
        author:
          type: string
          description: who wrote the comment 
          minLength: 1
          maxLength: 16
          pattern: "^.*?$"
        emoji:
          type: string
          description: the effective comment
          minLength: 1
          maxLength: 2
          pattern: "^[\u0000-\uFFFF]+$"
    
  #PARAMETERS               
  parameters:
    userId:
      schema:
        type: integer
        minimum: 1
        maximum: 999
      required: true
      description: user identifier
      in: path
      name: userid
    
    conversationId:
      schema:
        type: integer
        minimum: 1
        maximum: 999
      required: true
      description: conversation identifier
      in: path
      name: conversationid
    
    messageId:
      schema:
        type: integer
        minimum: 1
        maximum: 999
      description: message identifier
      required: true
      in: path
      name: messageid
      
    commentId:
      schema:
        type: integer
        minimum: 1
        maximum: 999
      description: comment identifier
      required: true
      in: path
      name: commentid

    forwardId:
      schema:
        type: integer
        minimum: 1
        maximum: 999
      description: identifies which user to send the message to
      required: true
      in: path
      name: forwardid

  #SECURITY
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

#TAGS
tags:
  - name: Login
    description: User login operations
  - name: Profile
    description: User profile operations
  - name: Conversations
    description: Conversations operations
  - name: Messages
    description: Messaging operations
  - name: Comments
    description: Operations relating to message comments
  - name: Groups
    description: Operations relating to groups
      
security:
  - bearerAuth: [] 

paths:
  #doLogin
  /login:
    post:
      security: []
      tags: ["Login"]
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created, and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User Details
        content:
          application/json:
            schema:
              description: User properties
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/User/properties/name"
        required: True
      responses:
        "201":
          description: User log-in action successful
          content:
            application/json:
              schema:
                description: what return after login
                type: object
                properties:
                  identifier:
                    type: string
                    description: password
                    example: "abcdef012345"
              example: {identifier: "abcd2394"}
        "500":
          description: internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"
                    
  #setMyUserName
  /settings/username:
    put:
      tags: ["Profile"]
      summary: Set your username
      description: |
        You can set a new username
      operationId: setMyUserName
      requestBody:
        description: insert here the username
        required: true
        content:
          application/json:
            schema:
              description: username's schema
              type: object
              properties:
                username:
                  $ref: "#/components/schemas/User/properties/name"
      responses:
        "201":
          description: username set
          content:
            application/json:
              schema:
                type: object
                description: the new username
                properties:
                  username:
                    $ref: "#/components/schemas/User/properties/name"
              example: 
                username: "sbrellu"
        "400":
          description: bad request
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Bad Request"
        "401":
          description: user unauthorized
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "User Unauthorized"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"
  
  #getMyConversations e newGroup
  /conversations:
    get:
      tags: ["Conversations"]
      summary: get all user's conversations
      description: |
        You can see user's conversations history here
      operationId: getMyConversations
      responses:
        "404":
          description: user's conversations not found
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Conversation not found"
        "200":
          description: user's conversations found
          content:
            application/json:
              schema:
                description: conversation properties
                type: object
                properties:
                  conversations:
                    description: user conversations
                    type: array
                    minItems: 0
                    maxItems: 32
                    items:
                      $ref: "#/components/schemas/Conversation"
              example:
                conversations:
                  - conversationId: 123
                    title: "Avanti Lazio"
                    photo: "nsadoNISABDnsd..."
                    isGroup: False
                    members:
                      - userId: 33
                        name: "Franco"
                        photo: "nsadoNISABDnsd..."
                        bio: "Sto viaggiando"
                        number: "+3933333333"
                      - userId: 34
                        name: "Franca"
                        photo: "nsadoNISABDnsd..."
                        bio: "Sto camminando"
                        number: "+3933333334" 
                  - conversationId: 124
                    title: "Viva i cani"
                    photo: "nsadoNISABDnsd..."
                    isGroup: True
                    members: 
                      - userId: 37
                        name: "Franco"
                        photo: "nsadoNISABDnsd..."
                        bio: "Sto viaggiando"
                        number: "+3933333333"
                      - userId: 322
                        name: "Francisco"
                        photo: "nsadoNISABDnsd..."
                        bio: "Sto viaggiando"
                        number: "+3933333333"
                      - userId: 39
                        name: "Francesco"
                        photo: "nsadoNISABDnsd..."
                        bio: "hola"
                        number: "+3933333333"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"
  #newGroup
    post:
      tags: [Groups]
      summary: create a new group
      description: |
        You can create a new group chat between many users
      operationId: newGroup
      requestBody:
        required: true
        description: users that you want to include into the group
        content:
          application/json:
            schema:
              description: group's partecipants ids
              type: array
              items:
                $ref: "#/components/schemas/User/properties/userId"
      responses:
        "200":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation/properties/conversationId"
              example: 3
        "400":
          description: unable to create the group
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Unable to create the group"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"
                      
  #getConversation 
  /conversations/{conversationid}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      tags: ["Conversations"]
      summary: get a specific conversation
      description: |
        You can see a specific conversation
      operationId: getConversation
      responses:
        "404":
          description: conversation not found
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Conversation not found"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"
        "200":
          description: conversation found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
              example:
                  conversationId: 183
                  title: "Avanti Lazio"
                  photo: "nsadoNISABDnsd..."
                  isGroup: false
                  members:
                    - userId: 33
                      name: "Franco"
                      photo: "nsadoNISABDnsd..."
                      bio: "Sto viaggiando"
                      number: "+3933333333"
                    - userId: 34
                      name: "Franca"
                      photo: "nsadoNISABDnsd..."
                      bio: "Sto camminando"
                      number: "+3933333334"
          
  #sendMessage 
  /conversations/{conversationid}/message:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    post:
      tags: ["Messages"]
      summary: send a new message
      description: |
        You can send a new message in a specific conversation
      operationId: sendMessage
      requestBody:
        required: true
        description: Message that you want to send
        content:
          application/json:
            schema:
              description: content of the message
              type: object
              properties:
                author:
                  $ref: "#/components/schemas/Message/properties/author"
                text:
                  $ref: "#/components/schemas/Message/properties/text"
                hours:
                  $ref: "#/components/schemas/Message/properties/hours"
      responses:
        "200":
          description: sending successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                messageId: 153
                author: "MarcoL"
                text: "Ciao, posso parlarti?"
                hours: "22:20"
                comments: [{commentId: 125 ,author: "Stef" ,emoji: "\uD83D\uDE02" },
                            {commentId: 541 ,author: "Gio" ,emoji: "\uD83D\uDE02"}]
        "400":
          description: unable to send the message
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Unable to send the message"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"
  
  #forwardMessage
  /conversations/{conversationid}/messages/{messageid}/forward/{forwardid}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
      - $ref: "#/components/parameters/messageId"
      - $ref: "#/components/parameters/forwardId"
    post:
      tags: ["Messages"]
      summary: forward a message
      description: |
        You can forward a message
      operationId: forwardMessage
      responses:
        "400":
          description: unable to forward the message
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Unable to forward the message"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"
        "200":
          description: forwarded message
          content:
            application/json:
              schema:
                $ref : "#/components/schemas/Message"
              example:
                messageId: 10
                author: "MarcoL"
                text: "Ciao, posso parlarti?"
                hours: "22:20"
                comments: [{commentId: 13 ,author: "Stef" ,emoji: "\uD83D\uDE02"},
                            {commentId: 54 ,author: "Gio" ,emoji: "\uD83D\uDE02"}]
  
  #commentMessage
  /conversations/{conversationid}/messages/{messageid}/comments:
    parameters:
      - $ref: "#/components/parameters/messageId"
      - $ref: "#/components/parameters/conversationId"
    post:
      tags: ["Comments"]
      summary: comment a message
      description: |
        You can add a comment under a message
      operationId: commentMessage
      requestBody:
        required: true
        description: Comment that you want to add below a message
        content:
          application/json:
            schema:
              description: content of the comment
              type: object
              properties:
                author:
                  $ref: "#/components/schemas/Comment/properties/author"
                emoji:
                  $ref: "#/components/schemas/Comment/properties/emoji"
      responses:
        "400":
          description: unable to comment the message
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Unable to comment the message"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"
        "201":
          description: message commented correctly
          content:
            application/json:
              schema:
                $ref : "#/components/schemas/Comment"
              example:
                commentId: 100
                author: "stefano123"
                emoji: "\uD83D\uDE02"
  
  #uncommentMessage
  /conversations/{conversationid}/messages/{messageid}/comments/{commentid}:
    parameters:
      - $ref: "#/components/parameters/messageId"
      - $ref: "#/components/parameters/commentId"
      - $ref: "#/components/parameters/conversationId"
    delete:
      tags: ["Comments"]
      summary: uncomment a message
      description: |
        You can delete a specific comment under a message 
      operationId: uncommentMessage
      responses:
        "400":
          description: unable to delete the comment
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Unable to delete the comment"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"
        "204":
          description: comment deleted
          
  #deleteMessage
  /conversations/{conversationid}/messages/{messageid}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
      - $ref: "#/components/parameters/messageId"
    delete:
      tags: ["Messages"]
      summary: delete a message
      description: |
        You can delete a specific message in a specific conversation
      operationId: deleteMessage
      responses:
        "400":
          description: unable to delete the message
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Unable to delete the message"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"
        "204":
          description: message deleted
  
  #addToGroup e leaveGroup
  /conversations/{conversationid}/members:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    put:
      tags: ["Groups"]
      summary: add to a group
      description: |
        You can add a member to a group
      operationId: addToGroup
      requestBody:
        required: true
        description: User that you want to add to group
        content:
          application/json:
            schema:
              description: user identity
              type: object
              properties:
                user:
                  $ref: "#/components/schemas/User/properties/userId"
      responses:
        "400":
          description: unable to add 
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Unable to add the member into the group"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"
        "200":
          description: added member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation/properties/members"
              example:
                  members:
                    - userId: 0
                      name: "Luca"
                      photo: "abCacDFDGhj..."
                      bio: "i'm working"
                      number: "+3933333333"
                    - userId: 1
                      name: "Mia"
                      photo: "abCacDFDGhj..."
                      bio: "i love dogs"
                      number: "+3933333344"
                    - userId: 2
                      name: "Marcello"
                      photo: "abCacDFDGhj..."
                      bio: "i love cats"
                      number: "+3933343344"
  #leaveGroup 
    delete:
      tags: ["Groups"]
      summary: leave a group
      description: |
        You can leave a group you no longer want to be a part of
      operationId: leaveGroup
      responses:  
        "204":
            description: you left the group
        "400":
            description: unable to leave group
            content:
              application/json:
                schema:
                  type: object
                  description: error schema
                  properties:
                    error:
                      type: string
                      description: error's description
                      example: "Unable to leave the group"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"

  #setGroupName 
  /conversations/{conversationid}/name:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    put:
      tags: ["Groups"]
      summary: set a new group name
      description: |
        You can set or change a group name
      operationId: setGroupName
      requestBody:
        required: true
        description: Name that you want to give to a group
        content:
          application/json:
            schema:
              description: future group name
              type: object
              properties:
                groupName:
                  $ref: "#/components/schemas/Conversation/properties/title"
      responses:
        "200":
            description: group name set
            content:
              application/json: 
                schema: 
                  description: the new group name
                  type: object
                  properties: 
                    groupName:
                      $ref: "#/components/schemas/Conversation/properties/title"
                example: 
                  groupName: "Gruppo calcetto"
        "400":
          description: unable to set a new group name
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Unable to set a new group name"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"

  #setMyPhoto 
  /settings/photo:
    put:
      tags: ["Profile"]
      summary: Set your profile photo
      description: |
        You can set or change your profile photo
      operationId: setMyPhoto
      requestBody:
        required: true
        description: Photo that you want to set
        content:
          application/json:
            schema:
              description: photo's schema
              type: object
              properties:
                photo:
                  $ref: "#/components/schemas/User/properties/photo"
      responses:
        "400":
          description: unable to set a new photo
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Unable to set a new photo"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"
        "200":
          description: new profile photo set
          content:
            application/json:
              schema:
                description: the new profile photo
                type: object
                properties:
                  photo: 
                    $ref: "#/components/schemas/User/properties/photo"
              example: 
                photo: "abcDFHDIaaaz..."

  #setGroupPhoto 
  /conversations/{conversationid}/photo:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    put:  
      tags: [Groups]
      summary: Set a new group photo
      description: |
        You can set or change a group photo
      operationId: setGroupPhoto
      requestBody:
        required: true
        description: Photo that you want to set
        content:
          application/json:
            schema:
              description: photo's schema
              type: object
              properties:
                photo:
                  $ref: "#/components/schemas/User/properties/photo"
      responses:
        "200":
            description: group photo set
            content:
              application/json:
                schema:
                  description:  the new group photo
                  type: object
                  properties:
                    photo:
                      $ref: "#/components/schemas/User/properties/photo"
                example: 
                  photo: "abcDFHDIaaaz..."
            
        "400":
          description: unable to set a new photo
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Unable to set a new photo"
            
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"

  #getUsers
  /users:
    get:
      tags: [Users]
      summary: get all users
      description: |
        You can get all the app users
      operationId: getUsers
      responses:
        "200":
            description: all the app users
            content:
              application/json:
                schema:
                  description:  list of user 
                  type: object
                  properties:
                    userIds: 
                      description: list of user ids
                      type: array
                      minItems: 0
                      maxItems: 100
                      items: 
                        $ref: "#/components/schemas/User/properties/userId"
                    names:
                      description: list of user names
                      type: array
                      minItems: 0
                      maxItems: 100
                      items:
                        $ref: "#/components/schemas/User/properties/name"
                example:
                  userIds: [20,40,30]
                  names: ["Giorgio","Elena","Bob"]
        "400":
          description: unable to get the app users
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Unable to get the app users"  
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"
  
  #newConversation
  /users/{userid}:
    parameters:
      - $ref: "#/components/parameters/userId"
    post: 
      tags: [Conversations]
      summary: create a new conversation
      description: |
        You can create a new one-to-one conversation between you and another user. (This is not a group chat)
      operationId: newConversation
      responses:
        "204":
          description: new conversation created succesfully
        "400":
          description: unable to create a conversation with this user
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Unable to create a new conversation"  
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
               type: object
               description: error schema
               properties:
                error:
                  type: string
                  description: error's description
                  example: "Internal Server Error"

  
    