openapi: 3.0.3
info:
  title: WasaText
  description: |
      Connect with your friends effortlessly using WASAText! <br>
      Send and receive messages, whether one-on-one or in groups, all from the convenience of your PC. <br>
      Enjoy seamless conversations with text or GIFs and easily stay in touch through your private chats or group discussions.
  version: "1"
  
components:
  schemas:
    User:
      type: object
      description: user's details
      properties:
        userId:
          type: integer
          description: user's number Id
          example: "000000"
        name:
          type: string
          description: user's name
          example: "Gennaro"
        photo:
          type: string
          format: uri
          description: user profile's photo
          example: "https://example.com/images/photo123.jpg"
        bio:
            type: string
            description: what user writes about him
            example: "based in Rome"
        number:
            type: string
            pattern: '^\+[0-9]+$'
            minLength: 10
            maxLength: 15
            description: user's cellphone number
            example: '+3972837482'

          
    Conversation:
      type: object
      description: conversation between different users
      properties:
        conversationId: 
          type: integer
          description: conversation's code
          minimum: 10000
          example: 12345
        title:
          type: string
          description: conversation name
          example: "Gruppo calcetto"
        photo:
          type: string
          format: uri
          description: conversation's photo
          example: "https://example.com/images/photo123.jpg"
        isGroup:
          type: boolean
          description: It's true if the conversation is a group, else it's false
    
    Message:
      type: object
      description: character string
      properties:
        messageId:
          type: integer
          description: message identifier
          minimum: 10000
          example: 12345
        text:
          type: string
          description: content of the message
          example: "Buongiorno!"
        hours:
          type: string
          description: at what time the message was sent
          example: "12:33"
        comments: 
          type: array
          items:
            $ref: "#/components/schemas/Comment"
           
    
    Comment:
      type: object
      description: character string under a Message
      properties:
        commentId:
          type: integer
          description: comment identifier
          minimum: 10000
        author:
          type: string
          description: who wrote the comment 
        text:
          type: string
          description: content of the comment
        feedback:
          type: object
          description: represent if people agree or not
          properties:
            like:
              type: integer
              minimum: 0
            dislike:
              type: integer
              minimum: 0
    
    Group:
      type: object
      description: list of users
      properties:
        groupId:
          type: integer
          description: message identifier
          minimum: 10000
          example: 12345
        groupName:
          type: string
          example: "Informatics"
        members:
          type: array
          items:
            $ref: "#/components/schemas/User"
    
    Photo:
      type: object
      description: photo chosen by the user
      properties:
        photoId:
          type: integer
          minimum: 00000
          maximum: 99999
          example: 12345
        url:
          type: string
          format: uri
          description: photo's url 
        title:
          type: string
          minLength: 1
          maxLength: 30
        size:
          type: object
          properties: 
            width: 
              type: integer
            height:
              type: integer
        
           
  parameters:
    userId:
      schema:
        type: integer
        minimum: 0
        maximum: 99999
      required: true
      description: user identifier
      in: path
      name: userId
    
    conversationId:
      schema:
        type: integer
        minimum: 0
        maximum: 99999
      required: true
      description: conversation identifier
      in: path
      name: conversationId
    
    messageId:
      schema:
        type: integer
        minimum: 0
        maximum: 99999
      description: message identifier
      required: true
      in: path
      name: messageId
      
    commentId:
      schema:
        type: integer
        minimum: 0
        maximum: 99999
      description: comment identifier
      required: true
      in: path
      name: commentId
    
    groupId:
      schema:
        type: integer
        minimum: 0
        maximum: 99999
      description: group identifier
      required: true
      in: path
      name: groupId

    forwardId:
      schema:
        type: integer
        minimum: 0
        maximum: 99999
      required: true
      in: path
      name: forwardId

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

security:
  - bearerAuth: [] 

paths:
  #doLogin
  /login:
    post:
      security: []
      tags: ["Login"]
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created, and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User Details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
        required: True
      responses:
        '200':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"
                    
  #setMyUserName
  /settings/username:
    patch:
      tags: ["Profile"]
      summary: Set your username
      description: |
        You can set a new username
      operationId: setMyUserName
      requestBody:
        description: insert here the username
        content:
          application/json:
           schema:
              type: object
              properties:
                username:
                  type: string
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '200':
          description: username set
      
  #getMyConversations
  /conversations:
    get:
      tags: ["Conversations"]
      summary: get all user's conversations
      description: |
        You can see user's conversations history here
      operationId: getMyConversations
      responses:
        '404':
          description: user's conversations not found
        '200':
          description: user's conversations found
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
                      
  #getConversation → GET /conversations/{conversationId}
  /conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      tags: ["Conversations"]
      summary: get a specific conversation
      description: |
        You can see a specific conversation
      operationId: getConversation
      responses:
        "404":
          description: conversation not found
        "200":
          description: conversation found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
          
  #sendMessage → POST /conversations/{conversationID}/messages
  /conversations/{conversationId}/message:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    post:
      tags: ["Messages"]
      summary: send a new message
      description: |
        You can send a new message in a specific conversation
      operationId: sendMessage
      responses:
        "200":
          description: sending successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: unable to send the message
  
  #forwardMessage
  /conversations/{conversationId}/messages/{messageId}/forward/{forwardId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
      - $ref: "#/components/parameters/messageId"
      - $ref: "#/components/parameters/forwardId"
    post:
      tags: ["Messages"]
      summary: forward a message
      description: |
        You can forward a message
      operationId: forwardMessage
      responses:
        "400":
          description: unable to forward the message
        "200":
          description: forwarded message
          content:
            application/json:
              schema:
                $ref : "#/components/schemas/Message"
  
  #commentMessage
  /conversations/{conversationId}/messages/{messageId}/comments:
    parameters:
      - $ref: "#/components/parameters/messageId"
      - $ref: "#/components/parameters/conversationId"
    post:
      tags: ["Comments"]
      summary: comment a message
      description: |
        You can add a comment under a message
      operationId: commentMessage
      responses:
        "400":
          description: unable to comment the message
        "200":
          description: message commented correctly
          content:
            application/json:
              schema:
                $ref : "#/components/schemas/Comment"
  
  #uncommentMessage
  /conversations/{conversationId}/messages/{messageId}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/messageId"
      - $ref: "#/components/parameters/commentId"
      - $ref: "#/components/parameters/conversationId"
    delete:
      tags: ["Comments"]
      summary: uncomment a message
      description: |
        You can delete a specific comment under a message 
      operationId: uncommentMessage
      responses:
        "400":
          description: unable to delete the comment
        "200":
          description: comment deleted
          
  #deleteMessage
  /conversations/{conversationId}/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
      - $ref: "#/components/parameters/messageId"
    delete:
      tags: ["Messages"]
      summary: delete a message
      description: |
        You can delete a specific message in a specific conversation
      operationId: deleteMessage
      responses:
        "400":
          description: unable to delete the message
        "200":
          description: message deleted
  
  #addToGroup
  /conversations/groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/groupId"
    patch:
      tags: ["Groups"]
      summary: add to a group
      description: |
        You can add a member to a group
      operationId: addToGroup
      responses:
        "400":
          description: unable to add 
        "200":
          description: added member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  #leaveGroup 
  /conversations/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/groupId"
    delete:
      tags: ["Groups"]
      summary: leave a group
      description: |
        You can leave a group you no longer want to be a part of
      operationId: leaveGroup
      responses:  
        "200":
            description: you left the group
        "400":
            description: unable to leave group

  #setGroupName 
  /conversations/groups/{groupId}/name:
    parameters:
      - $ref: "#/components/parameters/groupId"
    patch:
      tags: ["Groups"]
      summary: set a new group name
      description: |
        You can set or change a group name
      operationId: setGroupName
      responses:
        "200":
            description: group name set
            content:
              application/json: 
                schema: 
                  type: string
        "400":
          description: unable to set a new group name

  #setMyPhoto 
  /settings/photo:
    patch:
      tags: ["Profile"]
      summary: Set your profile photo
      description: |
        You can set or change your profile photo
      operationId: setMyPhoto
      responses:
        "400":
          description: unable to set a new photo
        "200":
          description: new profile photo set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"

  #setGroupPhoto → PUT /groups/{groupId}/photo 
  /conversations/groups/{groupId}/photo:
    parameters:
      - $ref: "#/components/parameters/groupId"
    patch:  
      tags: [Groups]
      summary: Set a new group photo
      description: |
        You can set or change a group photo
      operationId: setGroupPhoto
      responses:
        "400":
            description: unable to set a new photo
        "200":
            description: group photo set
            content:
              application/json:
                schema: 
                  $ref: "#/components/schemas/Group"
    